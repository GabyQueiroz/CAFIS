services:
  - type: web
    name: cafis-academia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CAFIS_COOKIE_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: CAFIS_ADMIN_EMAIL
        sync: false
      - key: CAFIS_ADMIN_PASSWORD
        sync: false
      - key: CAFIS_CAFIS_ADMIN_EMAIL
        value: adm.cafis@utfpr.edu.br
      - key: CAFIS_CAFIS_ADMIN_PASSWORD
        sync: false
